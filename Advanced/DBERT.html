<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MoodScope NLP Console — Sentiment Dashboard</title>

  <style>
    :root{
      --bg1:#0b0f14;
      --bg2:#111827;
      --card:#0f172a;
      --accent:#f59e0b;
      --accent2:#38bdf8;
      --border:rgba(255,255,255,0.08);
      --mono:SFMono-Regular, Menlo, monospace;
    }

    html,body{
      margin:0;
      height:100%;
      font-family:Inter,system-ui,Arial,sans-serif;
      background:linear-gradient(135deg,var(--bg1),var(--bg2));
      color:#e5e7eb;
    }

    .container{
      max-width:1150px;
      margin:30px auto;
      padding:24px;
      border-radius:16px;
      background:#020617;
      box-shadow:0 0 0 1px var(--border), 0 25px 50px rgba(0,0,0,.7);
    }

    header{
      display:flex;
      align-items:center;
      gap:14px;
      margin-bottom:16px;
    }

    .logo{
      width:56px;
      height:56px;
      border-radius:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:#020617;
      font-size:18px;
    }

    h1{
      margin:0;
      font-size:21px;
      font-weight:700;
    }

    .subtitle{
      font-size:12px;
      color:#9ca3af;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 420px;
      gap:18px;
    }

    .card{
      background:var(--card);
      border-radius:12px;
      padding:16px;
      border:1px solid var(--border);
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      border-radius:8px;
      padding:9px 14px;
      font-weight:600;
      cursor:pointer;
      transition:.15s ease;
    }

    .primary{
      background:var(--accent);
      color:#020617;
      border:none;
    }

    .ghost{
      background:transparent;
      border:1px solid var(--border);
      color:#e5e7eb;
    }

    button:hover{
      opacity:.9;
      transform:translateY(-1px);
    }

    .progress{
      height:10px;
      background:#020617;
      border-radius:999px;
      overflow:hidden;
      border:1px solid var(--border);
      margin-top:6px;
    }

    .progress i{
      display:block;
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--accent),var(--accent2));
      transition:width .6s;
    }

    .console{
      margin-top:10px;
      height:230px;
      overflow:auto;
      background:#020617;
      border-radius:8px;
      padding:10px;
      font-family:var(--mono);
      font-size:12.5px;
      border:1px solid var(--border);
    }

    .input-row{
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    input{
      flex:1;
      padding:9px;
      border-radius:7px;
      border:1px solid var(--border);
      background:#020617;
      color:#e5e7eb;
    }

    .metric{
      background:#020617;
      border-radius:10px;
      padding:12px;
      text-align:center;
      flex:1;
      border:1px solid var(--border);
    }

    footer{
      text-align:center;
      margin-top:14px;
      font-size:11.5px;
      color:#9ca3af;
    }

    @media(max-width:980px){
      .grid{grid-template-columns:1fr;}
    }
  </style>
</head>

<body>
<div class="container">

  <header>
    <div class="logo">MS</div>
    <div>
      <h1>MoodScope NLP Console</h1>
      <div class="subtitle">Sentiment Analysis & Model Training Interface (DistilBERT)</div>
    </div>
  </header>

  <div class="grid">

    <!-- LEFT -->
    <div>
      <div class="card">
        <div class="controls">
          <button id="btnTokenize" class="ghost">Preprocess Text</button>
          <button id="btnTrain" class="primary">Start Training</button>
          <button id="btnEval" class="ghost">Evaluate</button>
          <button id="btnSave" class="ghost">Save Model</button>
        </div>

        <div style="margin-top:14px">
          <div class="subtitle">Training Pipeline</div>
          <div class="progress"><i id="bar"></i></div>
        </div>

        <div class="subtitle" style="margin-top:12px">System Log</div>
        <div id="console" class="console"></div>

        <div class="input-row">
          <input id="txtExample" placeholder="Enter review text for sentiment prediction">
          <button id="btnPredict" class="primary">Predict</button>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div>
      <div class="card">
        <div style="display:flex;justify-content:space-between">
          <div>
            <strong>Model Status</strong>
            <div class="subtitle">Waiting</div>
          </div>
          <div style="text-align:right">
            <div class="subtitle">Compute</div>
            <div class="subtitle">CPU</div>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:14px">
          <div class="metric">
            <div><strong>Accuracy</strong></div>
            <div id="acc">–</div>
          </div>
          <div class="metric">
            <div><strong>F1 Score</strong></div>
            <div id="f1">–</div>
          </div>
        </div>

        <div style="margin-top:14px;text-align:center">
          <button id="btnClear" class="ghost">Clear Output</button>
        </div>
      </div>
    </div>

  </div>

  <footer>
    DistilBERT • Hugging Face Transformers • NLP Academic Demonstration
  </footer>

</div>

<!-- JS stays EXACTLY the same -->
<script>
  const consoleEl = document.getElementById('console');
  const bar = document.getElementById('bar');
  const accEl = document.getElementById('acc');
  const f1El = document.getElementById('f1');

  function log(t){
    const d=document.createElement('div');
    d.textContent=t;
    consoleEl.appendChild(d);
    consoleEl.scrollTop=consoleEl.scrollHeight;
  }

  function simulateProgress(dur,cb,end){
    let s=null;
    function step(t){
      if(!s)s=t;
      const p=Math.min(100,((t-s)/dur*100)|0);
      bar.style.width=p+'%';
      if(cb)cb(p);
      if(p<100)requestAnimationFrame(step);
      else end&&end();
    }
    requestAnimationFrame(step);
  }

  btnTokenize.onclick=()=>{log("Running preprocessing...");simulateProgress(1200,null,()=>log("Preprocessing completed."));}
  btnTrain.onclick=()=>{log("Training started...");simulateProgress(5000,p=>p%20===0&&log("Epoch progress "+p+"%"),()=>{accEl.textContent="0.87";f1El.textContent="0.86";log("Training finished.");});}
  btnEval.onclick=()=>{log("Evaluating model...");simulateProgress(1800,null,()=>log("Evaluation complete."));}
  btnSave.onclick=()=>{log("Saving trained model...");simulateProgress(900,null,()=>log("Model saved successfully."));}
  btnPredict.onclick=()=>{const t=txtExample.value||"Amazing movie!";log("Input: "+t);simulateProgress(800,null,()=>log("Prediction: POSITIVE (0.84)"));};
  btnClear.onclick=()=>{consoleEl.innerHTML="";bar.style.width="0%";accEl.textContent=f1El.textContent="–";}
</script>

</body>
</html>
