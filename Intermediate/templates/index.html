<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Price Prediction</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            padding: 30px 40px;
            width: 380px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2a5298;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e3c72;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🚗 Car Price Prediction</h2>

        <form action="/predict" method="post">

            <label>Manufacturing Year</label>
            <input type="number" name="year" placeholder="e.g. 2018" required>

            <label>Present Price (Lakhs)</label>
            <input type="number" step="0.01" name="present_price" placeholder="e.g. 9.5" required>

            <label>Kilometers Driven</label>
            <input type="number" name="kms_driven" placeholder="e.g. 45000" required>

            <label>Fuel Type</label>
            <select name="fuel_type" required>
                <option value="0">Petrol</option>
                <option value="1">Diesel</option>
                <option value="2">CNG</option>
            </select>

            <label>Seller Type</label>
            <select name="seller_type" required>
                <option value="0">Dealer</option>
                <option value="1">Individual</option>
            </select>

            <label>Transmission</label>
            <select name="transmission" required>
                <option value="0">Manual</option>
                <option value="1">Automatic</option>
            </select>

            <label>Number of Owners</label>
            <input type="number" name="owner" placeholder="e.g. 0 or 1" required>

            <button type="submit">Predict Price</button>
        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}
    </div>

</body>
</html>
